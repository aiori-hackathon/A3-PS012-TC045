name: Live demo
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Load the netem kernel module (needed by the two delayed lab servers)
        run: sudo modprobe sch_netem
      - name: Build the virtual environment and the Docker images
        run: make bootstrap
      - name: Optional PDF export
        run: .venv/bin/pip install weasyprint || echo "PDF export unavailable; HTML reports are still written"
      - name: Run the demo (lab, checks, both assessments, reports, replay)
        run: make demo
      - name: Build interactive Packet Tracer simulator with live CI telemetry
        if: always()
        run: .venv/bin/python -m resolverlens.cli sim --out docs/sim.html --site-dir _site
      - name: Show the results on this page
        if: always()
        run: |
          {
            echo "## ResolverLens live demo"
            echo
            echo "### Interactive Packet Tracer Simulator"
            echo "Live Web Simulator: https://aiori-hackathon.github.io/A3-PS012-TC045/"
            echo
            echo "### Main lab: 20 seeded servers"
            cat results/demo-main-*/summary.md || true
            echo
            echo "### Challenge set: 6 servers built to fool a single-flag check"
            cat results/demo-chal-*/summary.md || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload reports, evidence and interactive simulator
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-results
          path: |
            results/
            docs/sim.html
      - name: Upload GitHub Pages portal artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"
      - name: Deploy interactive simulator and live reports to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Container state and logs (only on failure)
        if: failure()
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'
          for c in rl-canary rl-t17 rl-c05 rl-ext; do echo "== $c"; docker logs "$c" 2>&1 | tail -15; done
